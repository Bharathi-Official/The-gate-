<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Princess Coming</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #080d20;
      color: #fff5d7;
      font-family: Georgia, "Times New Roman", serif;
    }
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 520px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 28%, rgba(91, 105, 174, .42), transparent 34%),
        linear-gradient(#080d20 0%, #182443 56%, #090d19 100%);
    }
    .moon {
      position: absolute; top: 7%; left: 50%; transform: translateX(-50%);
      width: clamp(70px, 12vw, 125px); aspect-ratio: 1; border-radius: 50%;
      background: #fff4d2;
      box-shadow: 0 0 24px #ffe9ad, 0 0 70px rgba(255, 225, 150, .45);
      opacity: .95;
    }
    .stars {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(2px 2px at 12% 17%, #fff 55%, transparent 60%),
        radial-gradient(1px 1px at 24% 32%, #fff 55%, transparent 60%),
        radial-gradient(2px 2px at 79% 13%, #fff 55%, transparent 60%),
        radial-gradient(1px 1px at 88% 36%, #fff 55%, transparent 60%),
        radial-gradient(2px 2px at 67% 29%, #fff 55%, transparent 60%),
        radial-gradient(1px 1px at 41% 12%, #fff 55%, transparent 60%),
        radial-gradient(1px 1px at 8% 43%, #fff 55%, transparent 60%);
      opacity: .8;
    }
    .castle {
      position: absolute; bottom: 24%; left: 50%; transform: translateX(-50%);
      width: min(84vw, 760px); height: 44%;
      background: linear-gradient(90deg, #151d37, #34415f 50%, #151d37);
      clip-path: polygon(0 100%,0 37%,8% 37%,8% 15%,15% 15%,15% 37%,27% 37%,27% 5%,34% 5%,34% 37%,43% 37%,43% 0,57% 0,57% 37%,66% 37%,66% 7%,73% 7%,73% 37%,85% 37%,85% 16%,92% 16%,92% 37%,100% 37%,100% 100%);
      opacity: .9;
      filter: drop-shadow(0 0 22px rgba(129, 156, 221, .15));
    }
    .castle::after {
      content: ""; position: absolute; inset: 15% 0 0;
      background: repeating-linear-gradient(90deg, transparent 0 7%, rgba(255,218,135,.12) 7.2% 7.5%, transparent 7.7% 14%);
    }
    .ground {
      position: absolute; bottom: 0; width: 100%; height: 30%;
      background: linear-gradient(#17213a, #05070e 75%);
      clip-path: polygon(0 20%, 100% 0, 100% 100%, 0 100%);
    }
    .path {
      position: absolute; bottom: -10%; left: 50%; transform: translateX(-50%);
      width: 42%; height: 44%;
      background: linear-gradient(90deg, rgba(126,132,165,.02), rgba(200,191,167,.24), rgba(126,132,165,.02));
      clip-path: polygon(43% 0,57% 0,100% 100%,0 100%);
    }
    .gate-frame {
      position: absolute; z-index: 3; bottom: 17%; left: 50%; transform: translateX(-50%);
      width: clamp(210px, 35vw, 330px); height: clamp(230px, 38vh, 340px);
      border: 10px solid #72512d;
      border-bottom: 0;
      border-radius: 48% 48% 0 0 / 24% 24% 0 0;
      box-shadow: 0 0 0 4px #b48a4b, 0 0 35px rgba(255, 195, 93, .22);
      overflow: hidden;
    }
    .arch-glow {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 70%, rgba(255,210,120,.24), transparent 64%);
      pointer-events: none;
    }
    .gate {
      position: absolute; inset: 0; display: flex; overflow: hidden;
      perspective: 900px;
    }
    .door {
      position: absolute; top: 0; bottom: 0; width: 50%;
      background:
        repeating-linear-gradient(90deg, transparent 0 22px, rgba(255,210,123,.18) 23px 26px, transparent 27px 43px),
        linear-gradient(90deg, #271a17, #634127 48%, #2c1b17);
      border: 3px solid #c19350;
      box-shadow: inset 0 0 18px #080808, 0 0 18px rgba(0,0,0,.55);
      transition: transform 5.5s cubic-bezier(.2,.7,.15,1);
    }
    .door::before {
      content: ""; position: absolute; inset: 10px;
      border: 2px solid rgba(236,190,111,.65);
      box-shadow: inset 0 0 14px rgba(0,0,0,.8);
    }
    .door.left { left: 0; transform-origin: left center; border-radius: 100% 0 0 0 / 45% 0 0 0; }
    .door.right { right: 0; transform-origin: right center; border-radius: 0 100% 0 0 / 0 45% 0 0; }
    .gate.open .door.left { transform: rotateY(-105deg); }
    .gate.open .door.right { transform: rotateY(105deg); }
    .message {
      position: absolute; z-index: 5; top: 43%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; text-align: center; padding: 0 12px;
      font-size: clamp(1.55rem, 4.8vw, 3.4rem);
      letter-spacing: .07em; line-height: 1.3;
      color: #fff0c7;
      text-shadow: 0 0 10px #f7d98b, 0 0 28px rgba(255,190,92,.65), 2px 3px 5px #000;
      animation: shimmer 2.8s ease-in-out infinite alternate;
    }
    .message span { display: block; font-size: .42em; letter-spacing: .28em; margin-bottom: 12px; }
    .start {
      position: absolute; z-index: 8; bottom: 5%; left: 50%; transform: translateX(-50%);
      padding: 12px 25px; border: 1px solid #e6c27d; border-radius: 30px;
      background: rgba(20, 17, 31, .72); color: #ffedc2; font: 600 14px Arial, sans-serif;
      letter-spacing: .12em; cursor: pointer; box-shadow: 0 0 18px rgba(255,203,112,.15);
      transition: background .25s, opacity .4s;
    }
    .start:hover { background: rgba(105, 72, 42, .8); }
    .start.hidden { opacity: 0; pointer-events: none; }
    .sparkle {
      position: absolute; z-index: 4; bottom: 19%; left: 50%; width: 4px; height: 4px;
      background: #ffe6a3; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(255,213,119,.7);
      animation: float 4s ease-in-out infinite;
    }
    .sparkle.s1 { left: 42%; animation-delay: -1s; }
    .sparkle.s2 { left: 58%; animation-delay: -2.4s; }
    .sparkle.s3 { left: 49%; animation-delay: -3s; }
    @keyframes shimmer { from { opacity: .82; } to { opacity: 1; } }
    @keyframes float { 0%,100% { transform: translateY(0) scale(.7); opacity: .25; } 50% { transform: translateY(-65px) scale(1.2); opacity: 1; } }
    @media (max-height: 600px) {
      .castle { height: 39%; bottom: 20%; }
      .gate-frame { height: 48%; bottom: 12%; }
      .message { top: 34%; }
      .start { bottom: 2%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="castle"></div>
    <div class="ground"></div>
    <div class="path"></div>
    <div class="gate-frame">
      <div class="arch-glow"></div>
      <div class="gate" id="gate">
        <div class="door left"></div>
        <div class="door right"></div>
      </div>
    </div>
    <div class="message"><span>✨ A ROYAL ARRIVAL ✨</span>Princess coming...</div>
    <i class="sparkle s1"></i><i class="sparkle s2"></i><i class="sparkle s3"></i>
    <button class="start" id="startButton" type="button">OPEN THE GATES</button>
  </main>
  <script>
    const gate = document.getElementById("gate");
    const button = document.getElementById("startButton");

    function openGate() {
      gate.classList.add("open");
      button.classList.add("hidden");
      button.setAttribute("aria-hidden", "true");
      window.setTimeout(() => button.remove(), 700);
    }

    button.addEventListener("click", openGate);
    // Start the slow opening automatically after a short magical pause.
    window.setTimeout(openGate, 1400);
  </script>
</body>
</html>
